name: CrawlText quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend JavaScript syntax
        run: node --check frontend/app.js
      - name: Python syntax
        run: python -m compileall -q app.py main.py crawler.py extractor.py security.py
      - name: Install test dependencies
        run: python -m pip install pytest beautifulsoup4 lxml trafilatura httpx fastapi sse-starlette
      - name: Unit tests
        run: python -m pytest -q tests
